[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudmesh-ai-vpn"

dynamic = ["version"]
description = "Extension vpn created by CME"
license = "Apache-2.0"
dependencies = [
    "cloudmesh-ai-cmc",
    "click",
    "rich",
    "pytest",
    "pexpect",
    "cloudmesh-ai-common",
]
[tool.setuptools.dynamic]
version = {file = "VERSION"}

[project.entry-points."cloudmesh.ai.command"]
vpn = "command.vpn:register"

[tool.setuptools.packages.find]
where = ["src"]
include = ["command*"]
